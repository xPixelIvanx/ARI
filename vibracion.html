<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Prueba de vibración</title>
  <style>
    body { margin: 0; padding: max(20px, env(safe-area-inset-top)) 20px 40px; font: 16px/1.4 system-ui, sans-serif; background: #14101b; color: #f3ecf1; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 6px 0; color: #cdbfc5; }
    .box { margin: 16px 0; padding: 14px; border: 1px solid #ffffff22; border-radius: 16px; background: #ffffff0a; }
    button { display: block; width: 100%; min-height: 54px; margin-top: 10px; border: 0; border-radius: 14px; background: #cf6a8a; color: #fff; font: 600 16px system-ui, sans-serif; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    #log { white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; color: #e9c46a; }
  </style>
</head>
<body>
  <h1>Prueba de vibración</h1>
  <p>Abre esta página en el celular y prueba cada botón. Dime cuáles sí vibran.</p>

  <div class="box"><div id="log">…</div></div>

  <button id="a">1 · Vibrar con navigator.vibrate (Android)</button>
  <button id="b">2 · Tic de iPhone (un toque)</button>
  <button id="c">3 · Mantén presionado: pulsos mientras sostienes</button>
  <button id="d">4 · Patrón de florecer (tres tics)</button>

  <script type="module">
    import { buzz, nativeVibrate } from "./js/haptics.js";
    const log = document.getElementById("log");
    const lines = [
      `navigator.vibrate: ${nativeVibrate ? "SÍ existe" : "NO existe (iPhone/Safari)"}`,
      `Navegador: ${navigator.userAgent.replace(/\).*/, ")")}`,
    ];
    const paint = () => (log.textContent = lines.join("\n"));
    paint();
    const note = (t) => (lines.push(t), paint());

    document.getElementById("a").addEventListener("click", () => note(`vibrate(200) → ${navigator.vibrate?.(200)}`));
    document.getElementById("b").addEventListener("click", () => (buzz(10), note("tic enviado")));
    document.getElementById("d").addEventListener("click", () => (buzz([40, 120, 40, 120, 40]), note("patrón enviado")));

    const c = document.getElementById("c");
    let id = 0;
    c.addEventListener("pointerdown", () => {
      buzz(14);
      id = setInterval(() => buzz(14), 120);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => c.addEventListener(ev, () => (clearInterval(id), buzz(0))));
    c.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
