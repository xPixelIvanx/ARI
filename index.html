<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0A10" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Para ti</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23CF6A8A'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23fff' stroke-opacity='.5'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/carousel.css" />
  <script type="module" src="js/carousel.js"></script>
  <link rel="stylesheet" href="css/auth.css" />
  <script type="module" src="js/session.js" data-page="index"></script>
</head>
<body>
  <main class="hub">
    <p class="hub__kicker">Desliza para ver más</p>

    <!-- Carrusel 3D: los folletos forman un anillo. El JS agrega copias (clones) para llenarlo. -->
    <div class="scene" id="scene" aria-roledescription="carrusel" aria-label="Folletos">
      <div class="ring" id="ring">

        <!-- 1. El regalo actual -->
        <section class="slide" aria-roledescription="diapositiva" aria-label="1 de 3">
          <div class="card card--gift">
            <span class="card__mono">A</span>
            <h1 class="card__title" data-ed="gift.title">Tengo algo para ti</h1>
            <p class="card__text" data-ed="gift.text">Algo hecho a mano, programado con todo el corazón.</p>
            <a class="btn" href="regalo.html" data-ed="gift.btn">Abrir</a>
          </div>
        </section>

        <!-- 2. Cuenta regresiva a la propuesta -->
        <section class="slide" aria-roledescription="diapositiva" aria-label="2 de 3">
          <div class="card card--timer">
            <p class="card__kicker" data-ed="timer.kicker">Falta</p>
            <div class="timer" id="timer">
              <div class="timer__unit"><span id="t-days" data-t="days">--</span><small>días</small></div>
              <div class="timer__unit"><span id="t-hours" data-t="hours">--</span><small>horas</small></div>
              <div class="timer__unit"><span id="t-mins" data-t="mins">--</span><small>min</small></div>
              <div class="timer__unit"><span id="t-secs" data-t="secs">--</span><small>seg</small></div>
            </div>
            <p class="card__text" data-ed="timer.text">para algo que quiero preguntarte.</p>
            <a class="btn" id="timer-link" data-t="link" href="proximo.html" data-ed="timer.btn" hidden>Abrir</a>
          </div>
        </section>

        <!-- 3. Próximamente -->
        <section class="slide" aria-roledescription="diapositiva" aria-label="3 de 3">
          <div class="card card--soon">
            <span class="card__sheen" aria-hidden="true"></span>
            <h2 class="soon__word" data-ed="soon.word">Próximamente</h2>
          </div>
        </section>

        <!-- 4. Wrapped: sus premios del año (se abre en año nuevo) -->
        <section class="slide" aria-roledescription="diapositiva" aria-label="4 de 4">
          <div class="card card--wrapped">
            <p class="card__kicker" data-ed="wrapped.kicker">Tu año en Ari</p>
            <h2 class="wrapped__word" data-ed="wrapped.word">Wrapped</h2>
            <p class="card__text" data-ed="wrapped.text">Tus premios del año por ser la mejor visitante.</p>
            <p class="wrapped__count">Se abre en <b data-t="wdays">--</b> días</p>
            <a class="btn" href="wrapped.html" data-t="wlink" hidden>Ver mi año</a>
          </div>
        </section>

      </div>
    </div>

  </main>
</body>
</html>
