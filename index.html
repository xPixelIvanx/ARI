<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de prueba</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    #status {
      margin-top: 1rem;
      font-size: 0.95rem;
      opacity: 0.8;
    }
    #status.ok { color: #4ade80; }
    #status.error { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>Página en construcción 💌</h1>
    <p id="status">Comprobando conexión con Firebase...</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const statusEl = document.getElementById("status");

    async function start() {
      try {
        const res = await fetch("./firebase-config.json");
        if (!res.ok) throw new Error("No se encontró firebase-config.json");
        const firebaseConfig = await res.json();

        const app = initializeApp(firebaseConfig);
        getFirestore(app);

        statusEl.textContent = "Conectado a Firebase correctamente ✅";
        statusEl.classList.add("ok");
      } catch (err) {
        statusEl.textContent = "Firebase no está configurado todavía (" + err.message + ")";
        statusEl.classList.add("error");
      }
    }

    start();
  </script>
</body>
</html>
