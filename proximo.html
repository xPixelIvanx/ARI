<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14101A" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Una pregunta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E9C46A'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/proximo.css" />
  <script type="module" src="js/proximo.js"></script>
</head>
<body>
  <a class="back" href="index.html" aria-label="Volver al carrusel"><span aria-hidden="true">←</span><span class="back__label">Volver</span></a>
  <div class="stars" aria-hidden="true"></div>

  <main class="night">
    <p class="night__kicker" id="kicker">Hay algo que quiero preguntarte</p>

    <h1 class="night__question" id="question">¿Quieres ser mi novia?</h1>

    <div class="night__choices" id="choices">
      <button class="yes" id="yes" type="button">Sí</button>
      <button class="no" id="no" type="button">No</button>
    </div>

    <section class="night__answer" id="answer" hidden aria-live="polite">
      <p class="night__answer-big">¡Sí! ❤️</p>
      <p class="night__answer-text">Ahora sí, es oficial.</p>
    </section>
  </main>
</body>
</html>
