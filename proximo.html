<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14101A" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Una pregunta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E9C46A'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/proximo.css" />
  <link rel="stylesheet" href="css/proximo-secciones.css" />
  <script type="module" src="js/proximo.js"></script>
  <link rel="stylesheet" href="css/auth.css" />
  <script type="module" src="js/session.js" data-page="proximo"></script>
</head>
<body class="is-locked">
  <div class="progress" id="progress" aria-hidden="true"><span></span></div>
  <a class="back" href="index.html" aria-label="Volver al carrusel"><span aria-hidden="true">←</span><span class="back__label">Volver</span></a>
  <div class="stars" aria-hidden="true"></div>

  <!-- Intro: el ramo de flores amarillas -->
  <section class="intro" id="intro" aria-label="Introducción">
    <div class="intro__top">
      <p class="intro__line is-in" id="intro-line"></p>

      <article class="reason" id="reason" aria-live="polite">
        <p class="reason__num" id="reason-num"></p>
        <h2 class="reason__title" id="reason-title"></h2>
        <p class="reason__text" id="reason-text"></p>
      </article>

      <div class="intro__end" id="intro-end">
        <h2 class="intro__end-title" id="end-title"></h2>
        <p class="intro__end-text" id="end-text"></p>
      </div>
    </div>

    <div class="garden" id="garden" aria-hidden="true"></div>

    <div class="intro__bottom">
      <button class="hold" id="hold" type="button" aria-label="Mantén presionado para hacer crecer una flor">
        <svg class="hold__ring" viewBox="0 0 80 80" aria-hidden="true">
          <circle class="hold__track" cx="40" cy="40" r="36" />
          <circle class="hold__progress" id="hold-progress" cx="40" cy="40" r="36" />
        </svg>
        <svg class="hold__bud" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21v-9" />
          <path d="M12 14c-3.5 0-5-2.2-5-5 3 0 5 1.8 5 5z" />
          <path d="M12 12c0-3.4 1.6-5.4 5-6 .3 3.2-1.6 5.6-5 6z" />
        </svg>
      </button>
      <p class="intro__hint" id="hint">Mantén presionado</p>
      <button class="enter" id="enter" type="button" hidden>Entrar</button>
    </div>
  </section>

  <!-- Contenido: se desbloquea al entrar -->
  <main class="page" id="page" inert data-ed-root>
    <header class="hero">
      <p class="eyebrow reveal" data-ed="ui.para">Para</p>
      <h1 class="hero__name reveal" id="hero-name" data-ed="nombre"></h1>
      <p class="hero__sub reveal" id="hero-sub" data-ed="ui.heroSub"></p>
      <a class="scroll-cue reveal" href="#historia">Sigue bajando</a>
    </header>

    <!-- Línea de tiempo -->
    <section class="section" id="historia">
      <div class="section__head reveal">
        <span class="section__num"></span>
        <h2 class="section__title" data-ed="historia.titulo"></h2>
        <p class="section__lead" data-ed="historia.texto"></p>
      </div>
      <ol class="tl" id="tl" data-ed-list="historia.momentos"></ol>
      <div class="tl-end reveal" id="tl-end">
        <span class="tl-end__line" aria-hidden="true"></span>
        <span class="tl-end__dot" aria-hidden="true"></span>
        <p class="tl-end__title" data-ed="historia.cierre"></p>
        <p class="tl-end__text" data-ed="historia.cierreTexto"></p>
      </div>
    </section>

    <!-- Antes y ahora -->
    <section class="section" id="antes">
      <div class="section__head reveal">
        <span class="section__num"></span>
        <h2 class="section__title" data-ed="antes.titulo"></h2>
        <p class="section__lead" data-ed="antes.texto"></p>
      </div>
      <div class="then reveal" id="then">
        <div class="then__toggle" role="group" aria-label="Entonces u hoy">
          <span class="then__pill" aria-hidden="true"></span>
          <button type="button" class="then__opt" data-state="entonces" aria-pressed="true" id="then-a"></button>
          <button type="button" class="then__opt" data-state="hoy" aria-pressed="false" id="then-b"></button>
        </div>
        <ul class="then__list" id="then-list" data-ed-list="antes.pares"></ul>
      </div>
    </section>

    <!-- Cosas que me enseñaste -->
    <section class="section" id="ensenaste">
      <div class="section__head reveal">
        <span class="section__num"></span>
        <h2 class="section__title" data-ed="ensenaste.titulo"></h2>
        <p class="section__lead" data-ed="ensenaste.texto"></p>
      </div>
      <ol class="lessons" id="lessons" data-ed-list="ensenaste.lista"></ol>
      <div class="lessons-end reveal" id="lessons-end">
        <p class="lessons-end__title" data-ed="ensenaste.cierre"></p>
        <p class="lessons-end__text" data-ed="ensenaste.cierreTexto"></p>
      </div>
    </section>

    <!-- Planes contigo -->
    <section class="section" id="planes">
      <div class="section__head reveal">
        <span class="section__num"></span>
        <h2 class="section__title" data-ed="planes.titulo"></h2>
        <p class="section__lead" data-ed="planes.texto"></p>
      </div>
      <ul class="plans" id="plans" data-ed-list="planes.lista"></ul>
      <div class="plans__meter reveal" id="plans-meter">
        <div class="plans__bar"><span id="plans-fill"></span></div>
        <p class="plans__count" id="plans-count"></p>
      </div>
    </section>

    <section class="section" id="promesas">
      <div class="section__head reveal">
        <span class="section__num"></span>
        <h2 class="section__title" id="pro-title" data-ed="promesas.titulo"></h2>
        <p class="section__lead" id="pro-text" data-ed="promesas.texto"></p>
      </div>
      <ol class="promises" id="promises" data-ed-list="promesas.lista"></ol>
    </section>

    <!-- Carta al futuro (se escribe sola) -->
    <section class="section" id="futuro">
      <div class="section__head reveal">
        <span class="section__num"></span>
        <h2 class="section__title" data-ed="futuro.titulo"></h2>
        <p class="section__lead" data-ed="futuro.texto"></p>
      </div>
      <div class="future reveal" id="future">
        <div class="future__lines" id="future-lines" data-ed-list="futuro.carta"></div>
        <p class="future__sign" id="future-sign"></p>
      </div>
    </section>

    <section class="section ask" id="pregunta">
      <div class="scratch" id="scratch">
        <p class="ask__kicker reveal" id="ask-kicker" data-ed="pregunta.kicker"></p>
        <h2 class="ask__question reveal" id="ask-question" data-ed="pregunta.texto"></h2>
        <canvas class="scratch__cover" id="scratch-cover" aria-hidden="true"></canvas>
      </div>
      <p class="scratch__hint" id="scratch-hint" aria-live="polite">Rasca aquí</p>
      <button class="sr-only" id="scratch-skip" type="button">Descubrir la pregunta</button>
      <div class="ask__choices reveal is-waiting" id="choices">
        <button class="yes" id="yes" type="button">Sí</button>
        <button class="no" id="no" type="button">No</button>
      </div>

      <div class="ask__answer" id="answer" hidden aria-live="polite">
        <p class="ask__answer-big" id="answer-big" data-ed="respuesta.grande"></p>
        <p class="ask__answer-text" id="answer-text" data-ed="respuesta.texto"></p>
        <p class="ask__answer-extra" id="answer-extra" data-ed="respuesta.extra"></p>
        <p class="ask__sign" id="sign" data-ed="firma"></p>
      </div>
    </section>
  </main>

  <button class="music" id="music" type="button" aria-label="Reproducir música" aria-pressed="false" hidden>
    <span class="music__bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
  </button>
</body>
</html>
